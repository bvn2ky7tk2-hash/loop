name: CI (Legacy - Use frontend.yml, backend.yml, mobile.yml instead)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# This workflow is kept for backward compatibility.
# New workflows have been split:
# - frontend.yml: Web app CI/CD
# - backend.yml: NestJS backend CI/CD
# - mobile.yml: React Native mobile CI/CD
#
# These per-app workflows trigger independently when their respective paths change,
# reducing CI run time and improving clarity for team members.

jobs:
  legacy-backend-typecheck:
    name: Backend TypeScript (Legacy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  legacy-web-typecheck:
    name: Web TypeScript (Legacy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  legacy-web-build:
    name: Web Build (Legacy)
    runs-on: ubuntu-latest
    needs: legacy-web-typecheck
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  legacy-accessibility:
    name: Accessibility (Legacy)
    runs-on: ubuntu-latest
    needs: legacy-web-typecheck
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Run axe-core accessibility tests
        run: npm test 2>/dev/null || true
