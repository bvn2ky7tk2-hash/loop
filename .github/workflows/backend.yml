name: Backend (NestJS) CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - 'packages/shared/**'

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint 2>/dev/null || true

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: backend-build
          path: apps/backend/dist/
          retention-days: 5

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loop_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loop_test
      DEPLOYMENT_MODE: saas
      TENANT_ENFORCEMENT: 'true'
      JWT_SECRET: ci_test_secret_at_least_32_chars_long_xx
      JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_32_chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      # Đồng bộ schema vào DB test (CI dùng DB throwaway, db push an toàn ở đây)
      - run: npx prisma db push --accept-data-loss
      # Test GATE: bao gồm integration cách ly tenant. Fail = chặn merge (KHÔNG còn || true).
      - run: npx jest --runInBand --forceExit

  deploy-backend:
    name: Deploy Backend to Staging
    runs-on: ubuntu-latest
    needs: backend-build
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: backend-build
          path: dist/
      - name: Deploy to server
        run: echo "Deploying backend to staging..."
        # Add your deployment script here
