name: Deploy (Staging/Production)

# Pipeline deploy THAM SỐ HÓA — kích hoạt THỦ CÔNG hoặc khi gắn tag release.
# KHÔNG tự chạy trên mỗi push để tránh fail khi chưa cấu hình secrets.
#
# YÊU CẦU GitHub Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      — IP/hostname server đích (vd 1.2.3.4 hoặc app.loop.vn)
#   DEPLOY_USER      — user SSH (vd deploy)
#   DEPLOY_SSH_KEY   — private key SSH (PEM) có quyền vào server
#   DEPLOY_PATH      — thư mục chứa docker-compose.yml + .env trên server (vd /opt/loop)
# Server cần sẵn: Docker + Docker Compose, đã clone repo (hoặc có compose+.env), .env đủ secret MẠNH.
#
# Chi tiết + checklist (gồm BLOCKER migration history) → DEPLOYMENT.md

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Môi trường deploy'
        required: true
        default: staging
        type: choice
        options: [staging, production]
  push:
    tags: ['v*']

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Kiểm tra secrets hạ tầng
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::error::Chưa cấu hình DEPLOY_HOST/USER/SSH_KEY/PATH. Xem DEPLOYMENT.md."
            exit 1
          fi
      - name: SSH deploy (pull → migrate → up → healthcheck → rollback)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            # Lưu image hiện tại để rollback
            PREV=$(docker compose images -q backend || true)
            echo "Image trước deploy: $PREV"

            # Backup DB trước khi đổi schema (BẮT BUỘC)
            bash scripts/db-backup.sh || { echo "Backup thất bại — DỪNG deploy"; exit 1; }

            # Kéo image mới + khởi động (migration chạy trong entrypoint — xem BLOCKER ở DEPLOYMENT.md)
            docker compose pull backend
            docker compose up -d backend

            # Healthcheck readiness (tối đa 60s) — fail thì ROLLBACK
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:3000/health/readiness >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "Readiness FAIL → rollback về $PREV"
              if [ -n "$PREV" ]; then docker tag "$PREV" ghcr.io/${{ github.repository }}/backend:latest || true; fi
              docker compose up -d backend
              exit 1
            fi
            echo "Deploy OK."
