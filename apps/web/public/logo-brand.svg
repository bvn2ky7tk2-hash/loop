<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loopGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0052CC"/>
      <stop offset="100%" stop-color="#4C9AFF"/>
    </linearGradient>
  </defs>

  <!-- ICON -->
  <g transform="translate(40,40)">
    <circle cx="120" cy="120" r="108"
            stroke="url(#loopGradient)" stroke-width="18" fill="none"
            stroke-linecap="round" stroke-dasharray="620 80"/>

    <path d="M40 120
             C40 70, 90 70, 120 120
             C150 170, 200 170, 200 120
             C200 70, 150 70, 120 120
             C90 170, 40 170, 40 120Z"
          fill="none" stroke="url(#loopGradient)"
          stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="218" cy="42" r="10" fill="#2684FF"/>
    <circle cx="235" cy="68" r="7"  fill="#4C9AFF"/>
    <circle cx="246" cy="92" r="5"  fill="#7AB8FF"/>
  </g>

  <!-- WORDMARK + TAGLINE -->
  <g transform="translate(340,95)">
    <text x="0" y="80"
          font-family="Poppins, Inter, sans-serif"
          font-size="110" font-weight="700"
          fill="#091E42" letter-spacing="-3">L&#x221E;p</text>

    <text x="5" y="145"
          font-family="Inter, sans-serif"
          font-size="34" fill="#42526E">
      Kết nối công việc, nhân sự và vận hành
    </text>
  </g>
</svg>
